apiVersion: agentkit/v1
kind: Agent
name: kb_agent
model: fireworks-glm
tier: default
selection: null
prompt: kb/answerer
tools:
  - {kb_search: {connector: kb-docs}}
  - {sql_query: {connector: kb-sql}}
output: /report.md
middleware:
  - {type: model_fallback, params: {models: ["fireworks-glm:strong"]}}
  - {type: model_retry, params: {max_retries: 2}}
  - {type: call_limit, params: {max_model_calls: 30}}
  # Budget the search tools, not every tool: a run that spends them must still write /report.md.
  - {type: tool_call_limit, params: {tool_name: kb_search, run_limit: 15}}
  - {type: tool_call_limit, params: {tool_name: sql_query, run_limit: 5}}
  - {type: pii, params: {type: email}}
  - {type: pii, params: {type: credit_card, strategy: mask}}
  - {type: require_output, params: {path: /report.md}}
