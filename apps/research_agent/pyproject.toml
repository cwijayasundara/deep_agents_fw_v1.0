[project]
name = "research-agent"
version = "0.0.1"
requires-python = ">=3.12,<3.13"
dependencies = ["agentkit-core", "agentkit-tools", "agentkit-middleware", "agentkit-deep", "agentkit-evals", "pyyaml"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_agent"]

[project.scripts]
research = "research_agent.cli:main"
research-eval = "research_agent.eval_cli:main"
