[project]
name = "research-agent"
version = "0.0.1"
requires-python = ">=3.12,<3.13"
dependencies = ["agentkit-core", "agentkit-tools", "agentkit-middleware", "agentkit-deep", "agentkit-evals", "agentkit-config"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_agent"]

[project.scripts]
research = "research_agent.cli:main"
research-eval = "research_agent.eval_cli:main"

[project.entry-points."agentkit.schemas"]
"research.ReviewState" = "research_agent.flow_nodes:ReviewState"

[project.entry-points."agentkit.nodes"]
"research.critique" = "research_agent.flow_nodes:critique"
"research.needs_rework" = "research_agent.flow_nodes:needs_rework"
