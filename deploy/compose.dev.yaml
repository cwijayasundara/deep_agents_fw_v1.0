# Local dev/test Postgres (pgvector on PG16). Run as compose project agentkit-*:
#   AGENTKIT_PG_PORT=55432 docker compose -p agentkit-dev -f deploy/compose.dev.yaml up -d --wait
# Tests: AGENTKIT_TEST_DATABASE_URL=postgresql://agentkit:agentkit@127.0.0.1:55432/agentkit
# Trace collector (opt-in profile; spans land in deploy/otel-out/spans.jsonl):
#   docker compose -p agentkit-dev -f deploy/compose.dev.yaml --profile tracing up -d
#   OTEL_EXPORTER_OTLP_ENDPOINT=http://127.0.0.1:4318 uv run python scripts/smoke.py --trace
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: agentkit
      POSTGRES_PASSWORD: agentkit
      POSTGRES_DB: agentkit
    ports:
      - "127.0.0.1:${AGENTKIT_PG_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentkit -d agentkit"]
      interval: 2s
      timeout: 3s
      retries: 30
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.164.0
    profiles: ["tracing"]
    command: ["--config=/etc/otelcol/config.yaml"]
    user: "0:0"  # write to the bind-mounted output dir regardless of host ownership
    volumes:
      - ./otel-collector.dev.yaml:/etc/otelcol/config.yaml:ro
      - ${AGENTKIT_OTEL_OUT:-./otel-out}:/otel-out
    ports:
      - "127.0.0.1:${AGENTKIT_OTLP_HTTP_PORT:-4318}:4318"
      - "127.0.0.1:${AGENTKIT_OTLP_GRPC_PORT:-4317}:4317"
