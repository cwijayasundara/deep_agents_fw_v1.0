# Local dev/test Postgres (pgvector on PG16). Run as compose project agentkit-*:
#   AGENTKIT_PG_PORT=55432 docker compose -p agentkit-dev -f deploy/compose.dev.yaml up -d --wait
# Tests: AGENTKIT_TEST_DATABASE_URL=postgresql://agentkit:agentkit@127.0.0.1:55432/agentkit
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: agentkit
      POSTGRES_PASSWORD: agentkit
      POSTGRES_DB: agentkit
    ports:
      - "127.0.0.1:${AGENTKIT_PG_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentkit -d agentkit"]
      interval: 2s
      timeout: 3s
      retries: 30
