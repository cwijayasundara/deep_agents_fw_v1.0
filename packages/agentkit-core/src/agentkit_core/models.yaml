# Logical model entries. Switching provider = pick a different entry name (config only).
# OpenAI, Google and Anthropic use only their cheap fast model on every tier (operator's call, 2026-11-01).
default_provider: anthropic
models:
  openai:
    fast: gpt-6-luna
    default: gpt-6-luna
    strong: gpt-6-luna
  google_genai:
    fast: gemini-3.8-flash
    default: gemini-3.8-flash
    strong: gemini-3.8-flash
  anthropic:
    fast: claude-haiku-5-5
    default: claude-haiku-5-5
    strong: claude-haiku-5-5
  fireworks-deepseek:
    provider: fireworks
    fast: accounts/fireworks/models/deepseek-v4p1-flash-1017
    default: accounts/fireworks/models/deepseek-v4p1-flash-1017
    strong: accounts/fireworks/models/deepseek-v4p1-flash-1017
  fireworks-glm:
    provider: fireworks
    fast: accounts/fireworks/models/glm-5p3-flash
    default: accounts/fireworks/models/glm-5p3-flash
    strong: accounts/fireworks/models/glm-5p3-flash
  fireworks-minimax:
    provider: fireworks
    fast: accounts/fireworks/models/minimax-m3p1-flash
    default: accounts/fireworks/models/minimax-m3p1-flash
    strong: accounts/fireworks/models/minimax-m3p1-flash
