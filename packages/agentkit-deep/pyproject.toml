[project]
name = "agentkit-deep"
version = "0.0.1"
requires-python = ">=3.12,<3.13"
dependencies = ["agentkit-core", "agentkit-middleware", "deepagents", "langgraph", "langchain-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentkit_deep"]
