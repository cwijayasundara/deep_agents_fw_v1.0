[project]
name = "agentkit-middleware"
version = "0.0.1"
requires-python = ">=3.12,<3.13"
dependencies = ["agentkit-core", "httpx", "langchain", "langchain-core", "langgraph"]

[project.entry-points."agentkit.middleware"]
call_limit = "agentkit_middleware.factories:call_limit"
tool_call_limit = "agentkit_middleware.factories:tool_call_limit"
model_fallback = "agentkit_middleware.factories:model_fallback"
model_retry = "agentkit_middleware.factories:model_retry"
tool_retry = "agentkit_middleware.factories:tool_retry"
pii = "agentkit_middleware.factories:pii"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentkit_middleware"]
