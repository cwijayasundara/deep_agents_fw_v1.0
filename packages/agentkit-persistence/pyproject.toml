[project]
name = "agentkit-persistence"
version = "0.0.1"
requires-python = ">=3.12,<3.13"
dependencies = ["agentkit-core", "langgraph", "langgraph-checkpoint-postgres",
  "psycopg[binary,pool]", "pycryptodome", "pydantic", "pydantic-settings"]

[project.scripts]
agentkit-prune = "agentkit_persistence.prune:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentkit_persistence"]
