[project]
name = "agentkit-telemetry"
version = "0.0.1"
requires-python = ">=3.12,<3.13"
dependencies = ["agentkit-core", "agentkit-middleware", "agentkit-persistence", "langchain-core", "langfuse",
  "opentelemetry-sdk", "opentelemetry-exporter-otlp", "pydantic-settings"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentkit_telemetry"]
