[project]
name = "agentkit-tools"
version = "0.0.1"
requires-python = ">=3.12,<3.13"
dependencies = ["agentkit-core", "ddgs", "httpx", "langchain-core"]

[project.entry-points."agentkit.tools"]
web_search = "agentkit_tools.factories:web_search"
fetch_url = "agentkit_tools.factories:fetch_url"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentkit_tools"]
