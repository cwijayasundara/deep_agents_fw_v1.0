[project]
name = "agentkit-workspace"
version = "0.0.1"
requires-python = ">=3.12,<3.13"
dependencies = [
  "agentkit-core", "agentkit-tools", "agentkit-middleware",
  "agentkit-deep", "agentkit-config", "agentkit-evals", "agentkit-persistence",
  "agentkit-telemetry",
  "research-agent",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "respx", "ruff", "mypy", "types-pyyaml"]
contracts = [
  "langgraph-checkpoint-postgres", "psycopg[binary,pool]", "pycryptodome",
]

[tool.uv]
package = false
default-groups = ["dev", "contracts"]

[tool.uv.workspace]
members = ["packages/*", "apps/*"]

[tool.uv.sources]
agentkit-core = { workspace = true }
agentkit-tools = { workspace = true }
agentkit-middleware = { workspace = true }
agentkit-deep = { workspace = true }
agentkit-config = { workspace = true }
agentkit-evals = { workspace = true }
agentkit-persistence = { workspace = true }
agentkit-telemetry = { workspace = true }
research-agent = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["packages", "apps", "contracts"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "live: hits real provider APIs (opt-in: pytest -m live)",
  "contract: pins observed behaviour of upstream langchain/langgraph/deepagents APIs (offline)",
  "pg: needs Postgres at AGENTKIT_TEST_DATABASE_URL (skips when unset)",
]
addopts = "-m 'not live' --import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["reports", "research_notes", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
