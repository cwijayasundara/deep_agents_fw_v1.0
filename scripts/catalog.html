<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>agentkit — platform catalog</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --panel2: #1c2330; --line: #2d3646;
    --text: #e6edf3; --dim: #8b98a9; --accent: #58a6ff; --green: #3fb950;
    --amber: #d29922; --red: #f85149; --purple: #bc8cff; --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif; }
  a { color: var(--accent); text-decoration: none; }
  .layout { display: grid; grid-template-columns: 230px 1fr; min-height: 100vh; }
  nav { background: var(--panel); border-right: 1px solid var(--line); padding: 18px 0; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
  nav .brand { padding: 0 18px 14px; font-weight: 700; font-size: 15px; }
  nav .brand small { display: block; color: var(--dim); font-weight: 400; font-size: 11px; }
  nav a { display: block; padding: 6px 18px; color: var(--dim); font-size: 13px; border-left: 2px solid transparent; }
  nav a:hover { color: var(--text); background: var(--panel2); }
  nav a.on { color: var(--accent); border-left-color: var(--accent); background: var(--panel2); }
  main { padding: 26px 34px 80px; max-width: 1060px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  h2 { font-size: 17px; margin: 34px 0 12px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
  .sub { color: var(--dim); font-size: 13px; margin-bottom: 18px; }
  .tiles { display: flex; flex-wrap: wrap; gap: 10px; }
  .tile { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 16px; min-width: 120px; }
  .tile b { display: block; font-size: 22px; }
  .tile span { color: var(--dim); font-size: 12px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
  .card h3 { margin: 0 0 6px; font-size: 14px; font-family: var(--mono); }
  .card .desc { color: var(--dim); font-size: 12.5px; }
  .badges { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 5px; }
  .badge { font-size: 10.5px; padding: 1px 7px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel2); color: var(--dim); font-family: var(--mono); }
  .badge.read { color: var(--green); border-color: var(--green); }
  .badge.external { color: var(--accent); border-color: var(--accent); }
  .badge.write { color: var(--red); border-color: var(--red); }
  .badge.on { color: var(--green); border-color: var(--green); }
  .badge.off { color: var(--dim); }
  .badge.label { color: var(--purple); border-color: var(--purple); }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--dim); font-weight: 600; font-size: 12px; }
  td.mono, code { font-family: var(--mono); font-size: 12px; }
  code { background: var(--panel2); padding: 1px 5px; border-radius: 4px; }
  .pipe { display: flex; flex-direction: column; gap: 2px; max-width: 620px; }
  .pipe .stage { background: var(--panel2); border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 6px; padding: 7px 12px; font-family: var(--mono); font-size: 12.5px; }
  .pipe .stage small { display: block; color: var(--dim); font-family: inherit; }
  .pipe .arrow { color: var(--dim); text-align: center; font-size: 10px; line-height: 1; }
  .pipe .stage.fixed { border-left-color: var(--red); }
  .tiers { display: grid; gap: 8px; max-width: 760px; }
  .tier { display: grid; grid-template-columns: 210px 1fr; gap: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; }
  .tier .path { font-family: var(--mono); font-size: 12.5px; }
  .tier .meta { font-size: 12px; color: var(--dim); }
  .tier.rw { border-left: 3px solid var(--green); }
  .tier.ro { border-left: 3px solid var(--red); }
  .bar { background: var(--panel2); border-radius: 4px; height: 8px; width: 100%; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--green); }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .filter { width: 100%; max-width: 420px; background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; font-size: 13px; margin-bottom: 4px; }
  .empty { color: var(--dim); font-style: italic; padding: 14px; border: 1px dashed var(--line); border-radius: 8px; }
  .kvs { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 6px 24px; font-size: 13px; }
  .kvs div b { color: var(--accent); font-family: var(--mono); font-weight: 500; }
  .section { display: none; }
  .section.on { display: block; }
</style>
</head>
<body>
<div class="layout">
  <nav id="nav"><div class="brand">agentkit<small>platform catalog</small></div></nav>
  <main>
    <h1>What's in the platform</h1>
    <div class="sub" id="genat"></div>
    <input class="filter" id="filter" placeholder="filter cards… (tools, models, prompts)">
    <div id="content"></div>
  </main>
</div>
<script>window.CATALOG = __CATALOG_JSON__;</script>
<script>
const C = window.CATALOG, esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const badge = (t, cls='') => `<span class="badge ${cls}">${esc(t)}</span>`;
const card = (title, body, extra='') => `<div class="card"><h3>${esc(title)}</h3>${body}${extra}</div>`;

function pipe(stages, fixed=[]) {
  return `<div class="pipe">` + stages.map((s, i) => {
    const [name, note] = Array.isArray(s) ? s : [s, ''];
    return (i ? `<div class="arrow">▼</div>` : '') +
      `<div class="stage ${fixed.includes(name) ? 'fixed' : ''}">${esc(name)}${note ? `<small>${esc(note)}</small>` : ''}</div>`;
  }).join('') + `</div>`;
}
function scoreBars(agg) {
  const keys = Object.keys(agg).filter(k => typeof agg[k] === 'number' && k !== 'mean_latency_s');
  return keys.map(k => {
    const v = agg[k], pct = k.includes('tokens') ? Math.min(100, v / 5000) : v * 100;
    return `<div style="margin:6px 0"><div style="display:flex;justify-content:space-between;font-size:12px">
      <span>${esc(k)}</span><b style="font-family:var(--mono)">${v}</b></div>
      <div class="bar"><i style="width:${pct}%"></i></div></div>`;
  }).join('');
}

const SECTIONS = {
  overview() {
    const t = C.tools.length, mw = C.middleware.canonical_order.length, m = C.models.models.length;
    const pr = C.prompts.length, apps = C.apps.length, ev = C.apps.reduce((n, a) => n + a.evals.filter(e => e.cases).reduce((s, e) => s + e.cases, 0), 0);
    const pins = Object.entries(C.pins).map(([k, v]) => `<div><b>${esc(k)}</b> ${esc(v)}</div>`).join('');
    return `<div class="tiles">
      <div class="tile"><b>${t}</b><span>governed tools</span></div>
      <div class="tile"><b>${mw}</b><span>middleware slots</span></div>
      <div class="tile"><b>${m}</b><span>model entries</span></div>
      <div class="tile"><b>${pr}</b><span>prompts</span></div>
      <div class="tile"><b>${apps}</b><span>apps</span></div>
      <div class="tile"><b>${ev}</b><span>eval cases</span></div>
      <div class="tile"><b>${C.skills.length}</b><span>skills</span></div>
    </div>
    <h2>Pinned stack</h2><div class="kvs">${pins}
      <div><b>side effects allowed</b> ${esc(C.policy.allowed_side_effects)}</div>
      <div><b>tenants</b> ${esc(C.policy.tenant_env_file)}</div></div>`;
  },
  packages() {
    return `<div class="cards">` + C.packages.map(p => card(p.name,
      `<div class="desc">${esc(p.description)}</div>`,
      `<div class="badges">${badge('v' + p.version)}${p.entry_point_groups.map(g => badge(g, 'label')).join('')}</div>`)).join('') + `</div>`;
  },
  tools() {
    return `<div class="cards">` + C.tools.map(t => {
      const m = t.meta || {};
      const badges = m.version ? `${badge(m.side_effects, m.side_effects)}${badge('v' + m.version)}${badge(m.classification)}${badge('identity: ' + m.identity)}` +
        (m.tenants ? badge('tenants: ' + m.tenants.join(',')) : badge('tenants: *')) : badge('no metadata', 'write');
      const params = t.params.map(p => `<tr><td class="mono">${esc(p.name)}${p.required ? '*' : ''}</td><td class="mono">${esc(p.type)}</td><td>${esc(p.description)}</td></tr>`).join('');
      return card(t.name,
        (m.owner ? `<div class="desc">owner: ${esc(m.owner)}</div>` : '') + (t.error ? `<div class="desc" style="color:var(--red)">${esc(t.error)}</div>` : ''),
        `<div class="badges">${badges}</div>` + (params ? `<table style="margin-top:8px"><tr><th>arg</th><th>type</th><th></th></tr>${params}</table>` : ''));
    }).join('') + `</div>
    <h2>Search fallback chain (auto)</h2>${pipe(C.search.auto_order.concat([C.search.keyless_last_resort + ' (keyless last resort)']))}`;
  },
  middleware() {
    const M = C.middleware, note = {
      selection: 'Decisions: picks tools + tier, once per thread', model_fallback: 'primary → strong on failure',
      model_retry: 'retries per model', tool_retry: 'retries tool calls', require_output: 'nudge until output file exists',
      call_limit: 'hard model-call budget', tool_call_limit: 'per-tool budgets', pii: 'redact email / mask cards',
    };
    const stack = M.canonical_order.map(t => [t, note[t] || '']);
    const guards = M.fixed_guards.map(g => [g.name + '  (fixed)', g.hook + ': ' + g.checks]);
    return `<h2>Always prepended by the factory — YAML cannot remove or reorder</h2>${pipe(guards, guards.map(g => g[0]))}
    <h2>Canonical user-middleware order (YAML file order is irrelevant)</h2>${pipe(stack)}
    <h2>Registered middleware factories</h2><div class="kvs">${M.factories.map(f => `<div><b>${esc(f)}</b></div>`).join('')}</div>
    <p class="sub">singletons (at most one each): ${esc(M.singletons.join(', '))}</p>`;
  },
  models() {
    const rows = C.models.models.map(m => `<tr><td class="mono">${esc(m.name)}</td><td>${esc(m.provider)}</td>
      <td class="mono">${esc(Object.entries(m.tiers).map(([t, v]) => t + ': ' + v).join(' · '))}</td>
      <td><code>${esc(m.key_env)}</code> ${badge(m.key_set ? 'set' : 'unset', m.key_set ? 'on' : 'off')}</td></tr>`).join('');
    const emb = C.models.embeddings.map(e => `<tr><td class="mono">${esc(e.name)}</td><td class="mono">${esc(e.model || '')}</td><td>${e.dims || ''}</td></tr>`).join('');
    return `<table><tr><th>entry</th><th>provider</th><th>tiers</th><th>key</th></tr>${rows}</table>
    <h2>Embeddings</h2><table><tr><th>entry</th><th>model</th><th>dims</th></tr>${emb}</table>`;
  },
  prompts() {
    if (!C.prompts.length) return `<div class="empty">no prompts found under libraries/</div>`;
    return `<div class="cards">` + C.prompts.map(p => card(p.name,
      p.versions.map(v => `<div style="margin:4px 0">${badge('v' + v.version, 'label')} <span class="desc">${esc(v.description || v.owner)}</span></div>`).join('') +
      Object.entries(p.labels).map(([l, v]) => badge(l + ' → v' + v, 'label')).join(' '))).join('') + `</div>`;
  },
  subagents() {
    if (!C.subagents.length) return `<div class="empty">none — define libraries/subagents/*.yaml</div>`;
    return `<div class="cards">` + C.subagents.map(s => card(s.name,
      `<div class="desc">${esc(s.description)}</div>`,
      `<div class="badges">${s.tools.map(t => badge('🔧 ' + t)).join('')}${s.response_schema ? badge('schema: ' + s.response_schema, 'label') : badge('no response_schema', 'write')}</div>`)).join('') + `</div>`;
  },
  skills() {
    if (!C.skills.length) return `<div class="empty">no skills ship yet — libraries/skills/&lt;name&gt;/SKILL.md (first candidate: kb_agent)</div>`;
    return `<div class="cards">` + C.skills.map(s => card(s.name, `<div class="desc">${esc(s.description)}</div><div class="badges">${badge(s.dir, 'label')}</div>`)).join('') + `</div>`;
  },
  connectors() {
    return `<div class="cards">` + C.connectors.map(c => card(c.name,
      `<div class="badges">${badge(c.kind, 'label')}</div>`,
      `<div class="kvs" style="margin-top:8px">${Object.entries(c.config).map(([k, v]) => `<div><b>${esc(k)}</b> ${esc(typeof v === 'object' ? JSON.stringify(v) : v)}</div>`).join('')}</div>`)).join('') + `</div>`;
  },
  apps() {
    return C.apps.map(a => {
      const ev = a.evals.map(e => e.cases ? card('evals/' + e.file, scoreBars(e.kinds) + `<div class="desc">${e.cases} cases: ${esc(JSON.stringify(e.kinds))}</div>`) :
        e.aggregate ? card('evals/' + e.file + (e.recorded ? ` <span class="desc">(${esc(e.recorded)})</span>` : ''), scoreBars(e.aggregate)) :
        card('evals/' + e.file, `<div class="desc">${esc((e.metrics || []).join(', '))}</div>`)).join('');
      return `<h2>${esc(a.name)} <span class="desc" style="font-weight:400">(${esc(a.dir)})</span></h2>
      <div class="kvs"><div><b>model</b> ${esc(a.model)} / ${esc(a.tier)}</div><div><b>selection</b> ${esc(a.selection || 'off')}</div>
      <div><b>prompt</b> ${esc(a.prompt)}</div><div><b>output</b> ${esc(a.output || 'last AI message')}</div>
      <div><b>subagents</b> ${esc(a.subagents.join(', ') || '—')}</div><div><b>flows</b> ${esc(a.flows.map(f => f.name + (f.interrupts.length ? ' (interrupt: ' + f.interrupts.join(',') + ')' : '')).join(', ') || '—')}</div></div>
      <h3 style="margin:14px 0 6px;font-size:13px;color:var(--dim)">middleware (canonical order)</h3>
      ${pipe(a.middleware.slice().sort((x, y) => (C.middleware.canonical_order.indexOf(x) + 1 || 99) - (C.middleware.canonical_order.indexOf(y) + 1 || 99)))}
      <h3 style="margin:14px 0 6px;font-size:13px;color:var(--dim)">tools</h3>
      <div class="badges">${a.tools.map(t => badge(typeof t === 'string' ? t : Object.keys(t)[0] + ' ' + JSON.stringify(Object.values(t)[0] || {}), 'label')).join('')}</div>
      ${ev ? `<h3 style="margin:14px 0 6px;font-size:13px;color:var(--dim)">evals &amp; gates</h3><div class="cards">${ev}</div>` : ''}`;
    }).join('');
  },
  memory() {
    return `<div class="tiers">` + C.memory_tiers.map(t =>
      `<div class="tier ${t.writable ? 'rw' : 'ro'}"><div class="path">${esc(t.path)}<div class="meta">${esc(t.backend)}<br>${esc(t.namespace)}</div></div>
       <div class="meta">${esc(t.scope)}<br>${badge(t.writable ? 'writable' : 'read-only', t.writable ? 'read' : 'write')}</div></div>`).join('') + `</div>
    <p class="sub">/org/AGENTS.md + /memories/AGENTS.md load into the prompt (org first). Backends built by agentkit_deep/memory.py.</p>`;
  },
  seams() {
    const groups = {};
    C.entry_points.forEach(e => (groups[e.group] = groups[e.group] || []).push(e));
    return Object.keys(groups).sort().map(g => `<h2>${esc(g)}</h2><table><tr><th>name</th><th>target</th><th>distribution</th></tr>
      ${groups[g].map(e => `<tr><td class="mono">${esc(e.name)}</td><td class="mono">${esc(e.target)}</td><td class="mono">${esc(e.dist)}</td></tr>`).join('')}</table>`).join('');
  },
};

const NAV = [
  ['overview', 'Overview'], ['tools', 'Tools & search'], ['middleware', 'Middleware & guards'],
  ['models', 'Models'], ['apps', 'Apps & evals'], ['memory', 'Memory tiers'], ['skills', 'Skills'],
  ['prompts', 'Prompts'], ['subagents', 'Subagents'], ['connectors', 'Connectors'],
  ['seams', 'Entry points / seams'], ['packages', 'Packages'],
];
const nav = document.getElementById('nav'), content = document.getElementById('content');
NAV.forEach(([id, label], i) => {
  const a = document.createElement('a');
  a.href = '#' + id; a.textContent = label; a.dataset.id = id;
  a.onclick = () => show(id);
  nav.appendChild(a);
  const sec = document.createElement('div');
  sec.className = 'section'; sec.id = id;
  sec.innerHTML = `<h2 style="margin-top:0">${label}</h2>` + SECTIONS[id]();
  content.appendChild(sec);
});
function show(id) {
  document.querySelectorAll('.section').forEach(s => s.classList.toggle('on', s.id === id));
  document.querySelectorAll('nav a').forEach(a => a.classList.toggle('on', a.dataset.id === id));
  location.hash = id;
}
document.getElementById('genat').textContent = 'generated ' + C.generated_at + ' · live from the installed workspace';
document.getElementById('filter').addEventListener('input', e => {
  const q = e.target.value.toLowerCase();
  document.querySelectorAll('.card, .tile').forEach(c => { c.style.display = !q || c.textContent.toLowerCase().includes(q) ? '' : 'none'; });
});
show(location.hash.slice(1) || 'overview');
</script>
</body>
</html>
